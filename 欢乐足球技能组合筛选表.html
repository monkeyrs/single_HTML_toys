<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3DS 欢乐足球-技能组合</title>
<style>
:root{
  /* 中性 / 结构色 */
  --bg:#f5f7fa; --card:#fff; --line:#e5e7eb; --line2:#d1d5db;
  --head:#eef2ff; --link:#2563eb; --ink:#1f2937; --mut:#94a3b8;
  /* 位置色（前锋/中场/后卫/门将）— 取自 Toy「3DS欢乐足球：技能查询」 */
  --fw:#2563eb; --mf:#eab308; --df:#dc2626; --gk:#9333ea; --all:#888;
  /* 卡级 T1–T4 — 同 Toy */
  --t1:#16a34a; --t2:#dc2626; --t3:#2563eb; --t4:#eab308;
  /* 类别色（进攻/防守/中场/全能/均衡/信息） */
  --c-atk:#dc2626; --c-def:#16a34a; --c-bal:#0ea5e9; --c-mid:#2563eb; --c-ful:#7c3aed; --c-info:#64748b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:18px auto;padding:16px 18px 24px;background:var(--card);
  border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
/* 页面标题（位于 Tab 之上） */
.ttl{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:.3px}
/* tabs —— Excel 工作表页签：扁平方角，贴底一线 */
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);padding:2px 8px;cursor:pointer;
  font-size:12px;line-height:1.5;height:20px;border-radius:0}
.tab:hover{color:var(--ink);background:#f1f5f9}
.tab.on{color:var(--link);border-bottom-color:var(--link);font-weight:600}
.panel{display:none}
.panel.on{display:block}
/* content sections（不用卡片方块，改用纯分段） */
.block,.gblock{margin-bottom:18px;padding-bottom:6px}
.block h3,.gblock h3{margin:0 0 8px;font-size:15px;font-weight:700}
.gblock h3.bal{color:var(--link)}
.gblock h3.ti1{color:var(--t1)} .gblock h3.ti2{color:var(--t2)} .gblock h3.ti3{color:var(--gk)} .gblock h3.ti4{color:var(--all)}
.gwrap{margin-top:10px}
.lead{margin:0 0 8px}
.note,.knote{color:var(--mut);font-size:12.5px;margin-top:10px}
.knote{padding-top:8px;border-top:1px dashed var(--line)}
ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
/* tables — Excel 风格：紧凑行高、网格线、冻结表头（整页平铺） */
.kv{width:100%;border-collapse:collapse;font-size:12px;line-height:1.2}
.kv th,.kv td{border:1px solid var(--line);padding:1px 4px;text-align:left;vertical-align:middle;white-space:nowrap}
.kv thead th{background:var(--head);font-size:11px;font-weight:600;color:#475569;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
/* 组合页顶部有筛选栏，表头需下移一行 */
#panel-combo .kv thead th{top:29px}
/* 组合页曾有 sticky 筛选栏，现已上移至固定顶栏，表头统一偏移 */
.kv td.w{white-space:normal;max-width:300px}
/* 窄列（位置/数值/胶囊）用 width:1% 技巧收缩到内容宽度 */
.kv td.nowrap,.kv td.num{width:1%}
.kv td.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv td.z{color:var(--mut)}
.kv .sum{font-weight:700}
.kv .neg{color:var(--df)}
.kv .nowrap{white-space:nowrap}
.scroll{overflow:visible}
.muted{color:var(--mut)}
/* 位置色标 */
.pill{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:middle;margin:0 1px 0 0}
.pFW{background:var(--fw)} .pMF{background:var(--mf)} .pDF{background:var(--df)} .pGK{background:var(--gk)} .pALL{background:var(--all)}
/* 课题卡标签：文字 + 底色方块（非胶囊），无边框无间距 */
.cap{display:inline-block;border-radius:2px;padding:0 4px;font-size:11px;line-height:1.55;color:#fff;
  white-space:nowrap;cursor:pointer;margin:0}
.cap:hover{filter:brightness(.92)}
/* 课题组色：按卡号首位数字 1x/2x/3x/4x（= tier 1–4） */
.cap.k1{background:var(--t1)} .cap.k2{background:var(--t2)}
.cap.k3{background:var(--t3)} .cap.k4{background:var(--t4);color:#3b2f00}
/* 版本页：与攻略页统一字号（12px 正文 / 12px 小标题 / 11px 注释） */
#panel-ver{font-size:12px;line-height:1.35}
#panel-ver .gblock{margin-bottom:8px;padding-bottom:0}
#panel-ver .gblock h3{font-size:12px;font-weight:700;margin:0 0 3px}
#panel-ver .knote{font-size:11px;margin-top:4px;padding-top:3px}
#panel-ver .gwrap{margin-top:0}
#panel-ver .kv{font-size:12px}
#panel-ver .kv thead th{font-size:11px}
#panel-ver a{font-size:12px}
/* 攻略页：紧凑排版，与表格同字号 */
#panel-guide{font-size:12px;line-height:1.35}
#panel-guide .gblock{margin-bottom:8px;padding-bottom:0}
#panel-guide .gblock h3{font-size:12px;font-weight:700;margin:0 0 3px}
#panel-guide .lead{margin:0 0 3px}
#panel-guide ul{margin:2px 0;padding-left:16px}
#panel-guide li{margin:0}
#panel-guide .knote{font-size:11px;margin-top:4px;padding-top:3px}
#panel-guide .gwrap{margin-top:0}
/* 隐藏属性页：底部排版与攻略页统一（12px 紧凑 / 同间距） */
#panel-tend{font-size:12px;line-height:1.35}
#panel-tend .block{margin-bottom:8px;padding-bottom:0}
#panel-tend .block h3{font-size:12px;font-weight:700;margin:0 0 3px}
#panel-tend .block h3.bal{color:var(--link)}
#panel-tend .lead{margin:0 0 3px}
#panel-tend ul{margin:2px 0;padding-left:16px}
#panel-tend li{margin:0}
#panel-tend .knote{font-size:11px;margin-top:4px;padding-top:3px}
/* 选手类型页：与攻略页统一（12px 紧凑 / 同间距） */
#panel-types{font-size:12px;line-height:1.35}
#panel-types .block{margin-bottom:8px;padding-bottom:0}
#panel-types .block h3{font-size:12px;font-weight:700;margin:0 0 3px}
#panel-types .lead{margin:0 0 3px}
#panel-types .knote{font-size:11px;margin-top:4px;padding-top:3px}
/* 隐藏属性页：分组标题行 */
.kv tr.grouprow td{background:#f8fafc;color:var(--mut);font-size:11px;font-weight:600;text-align:left;padding:1px 4px}
/* 组合标记徽标：庆祝 / 事故负面 / 特效 */
.badge{display:inline-block;border-radius:2px;font-size:11px;line-height:1.55;padding:0 3px;margin:0;color:#fff;white-space:nowrap}
.badge.b-celebrate{background:#f97316}
.badge.b-accident{background:#dc2626}
.badge.b-visible{background:#0ea5e9}
/* 类别色块 / 小标签 */
.pcat{display:inline-block;min-width:18px;text-align:center;border-radius:2px;color:#fff;font-size:11px;line-height:1.55;padding:0 3px;margin:0}
.pcat.atk{background:var(--c-atk)} .pcat.def{background:var(--c-def)} .pcat.bal{background:var(--c-bal)} .pcat.mid{background:var(--c-mid)} .pcat.ful{background:var(--c-ful)} .pcat.info{background:var(--c-info)}
.ttag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:2px;font-size:11px;line-height:1.55;padding:0 3px;margin:0}
/* 卡级标签 T1–T4 */
.tag{display:inline-block;border-radius:3px;padding:0 4px;font-size:11px;line-height:1.6;color:#fff;white-space:nowrap}
.tag.t1{background:var(--t1)} .tag.t2{background:var(--t2)} .tag.t3{background:var(--t3)} .tag.t4{background:var(--t4);color:#3b2f00}
/* 可点名称 */
.name{color:var(--link);cursor:pointer}
.name:hover{text-decoration:underline}
/* ===== 筛选栏：位置筛选 + 搜索 + 行数（组合页顶部，sticky） ===== */
.bar{position:sticky;top:0;z-index:30;background:var(--card);display:flex;align-items:center;gap:6px;
  padding:4px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.fgrp{display:flex;align-items:center;white-space:nowrap;flex:0 0 auto}
.flab{font-size:11px;color:var(--mut);margin-right:2px}
.q{flex:1 1 auto;min-width:80px;max-width:420px;padding:3px 8px;border:1px solid var(--line2);border-radius:5px;font-size:12px;outline:none;background:#fafafa}
.q:focus{border-color:var(--fw);background:var(--card)}
/* 位置筛选按钮：位置色文字常显，按下整颗填充位置色（像单表版） */
.pbtn{border:0;padding:0 5px;margin:0 2px 0 0;border-radius:3px;background:#e5e7eb;color:#374151;
  font:inherit;font-size:11px;line-height:1.8;cursor:pointer;white-space:nowrap;min-width:22px;text-align:center}
.pbtn[data-pos="FW"]{color:var(--fw)}
.pbtn[data-pos="MF"]{color:#a16207}
.pbtn[data-pos="DF"]{color:var(--df)}
.pbtn[data-pos="GK"]{color:var(--gk)}
.pbtn[data-pos="ALL"]{color:#6b7280}
.pbtn.on{color:#fff;font-weight:600}
.pbtn.on[data-pos="FW"]{background:var(--fw)}
.pbtn.on[data-pos="MF"]{background:var(--mf);color:#3b2f00}
.pbtn.on[data-pos="DF"]{background:var(--df)}
.pbtn.on[data-pos="GK"]{background:var(--gk)}
.pbtn.on[data-pos="ALL"]{background:var(--all)}
/* 详情弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:70}
.mask.on{display:block}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,92vw);max-height:86vh;overflow:auto;background:var(--card);border-radius:14px;padding:16px;z-index:71;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.on{display:block}
.modal h2{margin:0 0 2px;font-size:17px}
.modal .mid{color:var(--mut);font-size:11px;margin-bottom:10px}
.modal .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.modal .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.modal .row .neg{color:var(--df)}
.modal .ed{color:#475569;font-size:12.5px;margin-top:2px}
.modal h4:first-of-type{border-top:none;padding-top:0}
.modal h4{margin:12px 0 6px;font-size:13px;color:var(--ink)}
.modal .eff{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.modal .eff .en{font-weight:600}
.modal .eff .ed{color:#475569;font-size:12.5px;margin-top:2px}
.modal .close{display:block;width:100%;height:44px;margin-top:12px;border:0;border-radius:10px;background:var(--link);color:#fff;font-size:14px;cursor:pointer}
.modal .x{position:absolute;top:12px;right:12px;width:32px;height:32px;line-height:30px;text-align:center;border-radius:8px;cursor:pointer;color:var(--mut);font-size:18px}
.modal .x:hover{background:#f1f5f9}
.err{position:relative;z-index:80;background:#b91c1c;color:#fff;padding:10px 14px;font:13px/1.5 monospace;margin-bottom:12px;border-radius:8px}
/* 移动端：始终保持表格（仅横向滚动，不转卡片） */
@media(max-width:768px){
  .wrap{margin:10px;padding:12px 12px 16px;border-radius:10px}
  .scroll{overflow-x:auto}
  .kv thead th{position:static}
  .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-width:none;border-radius:14px 14px 0 0;max-height:88vh;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .modal .x{width:32px;height:32px;line-height:30px}
}
</style>
</head>

         ].join(' ').toLowerCase();
});
const POSN = {FW:'前锋', MF:'中场', DF:'后卫', GK:'门将', ALL:'通用（REC 未单列）'};
const TYCH = {'后援型':'援','阻止型':'阻','全能型':'全','进攻型':'攻','司令塔':'司','发动机':'发','清道夫':'清'};
const VARM = {'阻截型':'阻止型','攻击型':'进攻型'};

/* 位置推导：仅以 REC（推荐特训）为权威来源 */
const recJP = {};
['FW','MF','DF','GK'].forEach(p => (REC[p]||[]).forEach(([jp]) => { (recJP[jp]=recJP[jp]||new Set()).add(p); }));
D.rows.forEach(r => { const d = recJP[r.jp]; r.pos = (d && d.size) ? [...d] : ['ALL']; });
const TYPEPOS = {};
D.rows.forEach(r => { if(r.type && r.type.name){ const ps = r.pos && r.pos.length ? r.pos : ['ALL']; (TYPEPOS[r.type.name]=TYPEPOS[r.type.name]||new Set()); ps.forEach(p => TYPEPOS[r.type.name].add(p)); } });
for(const k in TYPEPOS) TYPEPOS[k] = [...TYPEPOS[k]];

/* ===== 通用工具 ===== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function posPills(a){ return (a&&a.length) ? a.map(p => '<span class="pill p'+p+'"></span>').join('') : '<span class="muted">—</span>'; }
/* 课题卡：按卡号首位数字取色（1x→k1 / 2x→k2 / 3x→k3 / 4x→k4） */
function capCls(code){ return 'cap k' + String(code).charAt(0); }
function statCell(v){ return v===0 ? '<td class="z num">—</td>' : '<td class="num '+(v<0?'neg':'')+'">'+(v>0?'+':'')+v+'</td>'; }

/* ===== 组合 ===== */
let comboPos = 'ALL';
function renderCombo(){
  let h = '';
  D.rows.forEach(r => {
    h += '<tr data-h="'+esc(r._h)+'" data-pos="'+esc((r.pos||[]).join(' '))+'">';
    h += '<td class="nowrap" data-label="位置">'+posPills(r.pos)+'</td>';
    h += '<td class="w" data-label="组合名称"><b class="name" data-idx="'+r._i+'" title="'+esc(r.cnAlt&&r.cnAlt.length?('又名：'+r.cnAlt.join('／')):'')+'">'+esc(r.cn)+'</b>'+(r.type ? '<span class="ttag">'+esc(TYCH[r.type.name]||r.type.name[0])+'</span>' : '')+flagBadges(r.flags)+'</td>';
    r.cards.forEach((c,i) => { const cd = CARD[c]; h += '<td data-label="课题'+(i+1)+'"><span class="'+capCls(cd.code)+'" data-code="'+esc(cd.code)+'">'+esc(cd.short)+esc(cd.code)+'</span></td>'; });
    for(let i=r.cards.length;i<3;i++) h += '<td class="muted" data-label="课题'+(i+1)+'">—</td>';
    h += '</tr>';
  });
  document.getElementById('comboBody').innerHTML = h;
}
document.getElementById('posBtns').addEventListener('click', e => {
  const b = e.target.closest('.pbtn[data-pos]'); if(!b) return;
  comboPos = b.dataset.pos;
  Array.from(e.currentTarget.children).forEach(x => x.classList.toggle('on', x===b));
  applyFilter();
});

/* ===== 全局筛选：对当前 Tab 的表格行做过滤 =====
   位置：对带 data-pos 的行生效（组合页 / 选手页）
   搜索：组合页用富检索串（含卡名日英/倾向），其余按行文本 */
function applyFilter(){
  const panel = document.querySelector('.panel.on');
  if(!panel) return;
  /* 搜索框只存在于组合页，搜索也只作用于组合页 */
  const q = (panel.id === 'panel-combo') ? (document.getElementById('q').value||'').trim().toLowerCase() : '';
  let shown = 0, total = 0, hasPos = false;
  panel.querySelectorAll('tbody tr').forEach(tr => {
    total++;
    let h = tr.getAttribute('data-h');
    if(h === null) h = tr.textContent.replace(/\s+/g,' ').toLowerCase();
    else h = h.toLowerCase();
    const okQ = !q || h.indexOf(q) >= 0;
    if(tr.classList.contains('grouprow')){ tr.style.display = q ? 'none' : ''; return; }
    const ps = tr.getAttribute('data-pos');
    if(ps) hasPos = true;
    const okP = (comboPos === 'ALL' || !ps) ? true : ps.split(' ').indexOf(comboPos) >= 0;
    const ok = okQ && okP;
    tr.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  // 无位置列的页面禁用位置筛选按钮
  document.querySelectorAll('#posBtns .pbtn').forEach(b => {
    b.disabled = !hasPos;
    b.style.opacity = hasPos ? '' : '.35';
    b.style.cursor = hasPos ? 'pointer' : 'default';
  });
  const c = document.getElementById('cnt');
  if(c) c.textContent = '';
}
document.getElementById('q').addEventListener('input', applyFilter);

/* ===== 单卡 ===== */
function renderCards(){
  let h = '<div class="scroll"><table class="kv"><thead><tr><th>卡名</th>';
  h += '<th class="num" title="射门=精度/球速/传球">射门</th><th class="num">速度</th><th class="num">体力</th>';
  h += '<th class="num" title="技术=持球/抢球/停球">技术</th><th class="num">体格</th><th class="num">弹跳</th><th class="num">意志</th><th class="num">合计</th></tr></thead><tbody>';
  D.meta.cards.forEach(c => {
    const e = CARD_EFF[c.code];
    const sh = [c.short, c.code, c.jp||'', c.en||'', CARD_TEND[c.code]||''].join(' ').toLowerCase();
    h += '<tr data-h="'+esc(sh)+'"><td class="w" data-label="卡名"><span class="'+capCls(c.code)+'" data-code="'+esc(c.code)+'">'+esc(c.short)+esc(c.code)+'</span></td>';
    if(e === 'rnd'){ h += '<td class="num" colspan="7" data-label="成长">随机提升（每日变化，合计不固定）</td>'; }
    else {
      let s = 0; e.forEach(v => { if(v>0) s += v; });
      [0,1,2,3,4,5,6].forEach(i => h += statCell(e[i]));
      h += '<td class="num sum">+'+s+'</td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  document.getElementById('panel-cards').innerHTML = h;
}

/* ===== 选手类型 ===== */
const TypeTend = {
  '平均型':'均衡发展、无偏重','发动机':'攻守切换快、大范围奔跑（引擎）','全能型':'盯人+支援进攻兼顾',
  '自由人':'区域防守+前插进攻','阻截型':'逼抢盯人+封堵射门','清道夫':'区域盯人+执拗逼抢',
  '后援型':'区域防守+补位','盯人型':'彻底盯人+拦截','司令塔':'传球/控球意识强、慢攻型',
  '机会创造型':'创造空间、跑出空位','攻击型':'纵向突进、速攻型','射手型':'摆脱盯人+进球意识'
};
function renderTypes(){
  let h = '<div class="scroll"><table class="kv"><thead><tr><th>类型</th><th>行为倾向特征</th><th>说明</th></tr></thead><tbody>';
  TYPES.forEach(t => {
    const cn = t[1], desc = t[3];
    const pos = TYPEPOS[cn] || TYPEPOS[VARM[cn]] || [];
    const tg = TYCH[cn] || cn[0];
    const sh = [cn, t[0], t[2], desc, TypeTend[cn]||''].join(' ').toLowerCase();
    h += '<tr data-h="'+esc(sh)+'" data-pos="'+esc(pos.join(' '))+'">'
       + '<td data-label="类型"><span class="ttag">'+esc(tg)+'</span><b class="name" data-type="'+esc(cn)+'">'+esc(cn)+'</b></td>'
       + '<td class="nowrap" data-label="行为倾向特征">'+esc(TypeTend[cn]||'')+'</td>'
       + '<td class="nowrap" data-label="说明">'+esc(desc)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="block"><p class="lead">「特别训练」的完整因果链为：<b>课题卡组合 → 特别训练（スペシャルメニュー）→ 行为倾向 12 细项 ±变化 → 攻守意识累积 → 选手类型切换</b>。</p></div>';
  document.getElementById('panel-types').innerHTML = h;
}

/* ===== 隐藏属性（原行为倾向） ===== */
function renderTend(){
  let h = '<div class="scroll"><table class="kv"><thead><tr><th>倾向</th><th>说明</th></tr></thead><tbody>';
  const CATL = {atk:'进攻', def:'防守', info:'意识'};
  const mk = (kind, txt) => {
    const sh = [CATL[kind], txt[0], txt[1], txt[2]].join(' ').toLowerCase();
    return '<tr data-h="'+esc(sh)+'"><td class="nowrap" data-label="倾向"><span class="pcat '+kind+'">'+CATL[kind]+'</span> '+esc(txt[1])+'</td><td class="w" data-label="说明">'+esc(txt[2])+'</td></tr>';
  };
  TEND.atk.forEach(t => h += mk('atk', t));
  TEND.def.forEach(t => h += mk('def', t));
  TEND.main.forEach(t => h += mk('info', t));
  h += '</tbody></table></div>';
  h += '<div class="block"><h3 class="bal">隐藏属性机制 ＆ 特别训练与隐藏属性的关系</h3>';
  h += '<p class="lead"><b>隐藏属性</b>（行動傾向）是一套不直接显示的数值系统：</p>';
  h += '<ul><li><b>主要 2 项</b>：攻撃意識 / 守備意識 → <b>只增不减</b>，由「特别训练」累积，决定选手类型</li>';
  h += '<li><b>细项 12 个</b>：进攻 7 + 防守 5 → <b>可增可减</b>，由课题卡组合触发的「特别训练」改变</li>';
  h += '<li>特别训练 = 课题卡 2~3 张特定组合 → 传授必杀技 + 改变行为倾向数值（见「组合」页的类型标签）</li>';
  h += '<li>类型由攻守意识累计决定；细项影响球员场上无球跑动/防守方式的 AI 行为</li></ul>';
  h += '<p class="lead">因果链：<b>课题卡 → 特别训练 → 行为倾向 12 细项 ±变化 → 攻守意识累积 → 选手类型切换</b>。</p>';
  h += '<div class="knote">⚠ 各特别训练对各细项的 ± 数值，目前仅能取得定性描述（攻/守倾向增减方向），精确数值尚待更多公开资料补充。</div>';
  h += '</div>';
  document.getElementById('panel-tend').innerHTML = h;
}

function renderGuide(){ document.getElementById('panel-guide').innerHTML = GUIDE_HTML; }
function renderVer(){ document.getElementById('panel-ver').innerHTML = VER_HTML; }

/* ===== 全部渲染（各自隔离，单页失败不连累其他） ===== */
safe('组合', renderCombo);
safe('单卡', renderCards);
safe('选手', renderTypes);
safe('隐藏', renderTend);
safe('攻略', renderGuide);
safe('版本', renderVer);
applyFilter();   // 初始化顶栏行数计数

/* ===== Tab 切换 ===== */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if(!b) return;
  const tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-'+tab));
  applyFilter();   // 切换后沿用当前搜索词与位置筛选
});

/* ===== 详情弹窗（点组合名 / 卡胶囊 / 类型名 弹出） ===== */
const mask = document.getElementById('mask'), modal = document.getElementById('modal');
function showModal(){ modal.classList.add('on'); mask.classList.add('on'); }
function closeModal(){ modal.classList.remove('on'); mask.classList.remove('on'); }
/* 关闭方式：× / 关闭按钮 / 点屏幕任意处（含弹窗内空白）/ Esc */
mask.addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if(e.target.closest('.close') || e.target.closest('.x')) { closeModal(); return; }
  const sel = window.getSelection && window.getSelection();      // 正在选中文字则不关
  if(sel && String(sel).length > 0) return;
  closeModal();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function openCombo(i){
  const r = D.rows[i];
  const pos = r.pos.length ? r.pos.map(p=>`<span class="pill p${p}"></span>${POSN[p]}`).join('　') : `<span class="pill pALL"></span>通用（REC 未单列）`;
  const cards = r.cards.map(c => {
    const cd=CARD[c], e=CARD_EFF[c];
    const g = e==='rnd' ? '随机（每日）' : STATS.map(([k,label],i2)=> e[i2]>0?`+${e[i2]} ${label}`:'').filter(Boolean).join('，');
    return `<div class="eff"><div class="en"><span class="${capCls(c)}">${esc(cd.short)}${esc(c)}</span></div><div class="ed">成长 ${g}　·　倾向：${esc(CARD_TEND[c]||'')}</div></div>`;
  }).join('');
  const stats = STATS.map(([k,label],i)=>`<div class="row"><span>${label}</span><span class="${r.stats[i]<0?'neg':''}">${r.stats[i]>0?'+':''}${r.stats[i]}</span></div>`).join('') + `<div class="row"><span>合计</span><span>${r.total}</span></div>`;
  modal.innerHTML = `<span class="x">×</span><h2>${esc(r.cn)}${r.cnAlt&&r.cnAlt.length?` <small style="font-weight:400;color:var(--mut)">／${r.cnAlt.map(esc).join('／')}</small>`:''}</h2>`
    + `<div class="mid">${esc(r.jp)}${r.en?` · ${esc(r.en)}`:''}${r.comboId?` · 卡号 ${esc(r.comboId)}`:''}</div>`
    + `<h4>适用位置</h4><div>${pos}</div>`
    + `<h4>课题组合（${r.cards.length} 张）</h4>${cards}`
    + `<h4>能力成长值</h4>${stats}`
    + (r.type?`<h4>类型变化</h4><div class="row"><span>累计使用</span><span>${r.type.times} 次 → ${esc(r.type.name)}</span></div>`:'')
    + (r.flags&&r.flags.length?`<h4>标记</h4><div>${flagBadges(r.flags)}</div>`:'')
    + `<button class="close">关闭</button>`;
  showModal();
}
function openCard(code){
  const cd = CARD[code], e = CARD_EFF[code];
  const stats = e==='rnd' ? '<div class="row"><span>成长</span><span>随机（每日变化）</span></div>'
    : STATS.map(([k,label],i)=>`<div class="row"><span>${label}</span><span class="${e[i]<0?'neg':''}">${e[i]>0?'+':''}${e[i]}</span></div>`).join('');
  modal.innerHTML = `<span class="x">×</span><h2>${esc(cd.short)} <small style="font-weight:400;color:var(--mut)">${esc(code)}</small></h2>`
    + `<div class="mid">课题卡 · 七项成长值 / 行为倾向影响</div>`
    + `<h4>七项成长值</h4>${stats}`
    + `<h4>倾向影响</h4><div class="ed">${esc(CARD_TEND[code]||'')}</div>`
    + `<button class="close">关闭</button>`;
  showModal();
}
function openType(cn){
  const t = TYPES.find(x=>x[1]===cn) || TYPES.find(x=> (VARM[x[1]]||x[1])===cn);
  if(!t) return;
  const cn2=t[1];
  const pos = TYPEPOS[cn2]||TYPEPOS[VARM[cn2]]||[];
  const pills = pos.length ? pos.map(p=>`<span class="pill p${p}"></span>${POSN[p]}`).join(' ') : '<span class="muted">全员可用</span>';
  modal.innerHTML = `<span class="x">×</span><h2>${esc(cn2)} <small style="font-weight:400;color:var(--mut)">${esc(t[2])}</small></h2>`
    + `<div class="mid">选手类型</div>`
    + `<h4>适用位置</h4><div>${pills}</div>`
    + `<h4>行为倾向特征</h4><div class="ed">${esc(TypeTend[cn2]||'')}</div>`
    + `<h4>说明</h4><div class="ed">${esc(t[3])}</div>`
    + `<button class="close">关闭</button>`;
  showModal();
}
document.addEventListener('click', e => {
  const nm = e.target.closest('.name[data-idx]');
  if(nm){ openCombo(parseInt(nm.dataset.idx,10)); return; }
  const cap = e.target.closest('.cap[data-code]');
  if(cap){ openCard(cap.dataset.code); return; }
  const tp = e.target.closest('.name[data-type]');
  if(tp){ openType(tp.dataset.type); return; }
});
</script>
