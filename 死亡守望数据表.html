const WEAPON_ORDER=['链锯剑','动力剑','动力斧','动力拳','治疗装置',
  '爆弹手枪','爆弹枪','重型爆弹枪',
  '等离子手枪','等离子枪','等离子炮',

  '导弹发射器','激光炮','重力枪'];

function sortWeps(rows){ return rows.slice().sort((a,b)=>{
  const ai=WEAPON_ORDER.indexOf(a.base), bi=WEAPON_ORDER.indexOf(b.base);
  const ac=ai<0?WEAPON_ORDER.length:ai, bc=bi<0?WEAPON_ORDER.length:bi;
  return ac-bc
      || (TIER_RANK[a.tier]||9)-(TIER_RANK[b.tier]||9)
      || (a.chapter?1:0)-(b.chapter?1:0);
}); }
const SK_AB={'主动':'主','被动':'被','人':'人','道':'道'};
const abbr=v=>CH_AB[v]||CL_AB[v]||SK_AB[v]||v;
const skAbbr=v=>SK_AB[v]||v;
function cap(cls,v){ return `<span class="cap c${abbr(v)}" title="${v}">${abbr(v)}</span>`; }
function buildBar(){
  const bar=document.getElementById('bar');
  bar.innerHTML = (FILTERS[tab]||[]).map(([lab,vals])=>
    `<span class="grp"><span class="lab">${lab}</span>`+
    vals.map(v=>`<button class="chip" data-k="${lab}" data-v="${v}" data-abbr="${abbr(v)}" title="${v}">${abbr(v)}</button>`).join('')+`</span>`).join('')
    + `<input id="q" class="q" placeholder="搜索">`;
  bar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, v=b.dataset.v;
    sel[k]=sel[k]||new Set();
    sel[k].has(v)?(sel[k].delete(v),b.classList.remove('on')):(sel[k].add(v),b.classList.add('on'));

  });
  const q=document.getElementById('q'); q.value=q.value||''; q.oninput=render;
}
const kw=()=> (document.getElementById('q')||{value:''}).value.trim().toLowerCase();

function hayWep(w){ return [w.display,w.base,w.tier,w.slot,w.chapter,w.damage,w.external,JSON.stringify(w.ref),...w.effects.map(e=>e.name+e.desc)].join(' ').toLowerCase(); }
function hayGear(g){ return [g.name,g.cat,g.tier,g.chapter,...(g.effects||[]).map(e=>e.name+e.desc)].join(' ').toLowerCase(); }

const cdText=v=>(v===undefined||v===null||v==='')?'':(typeof v==='string'?v:(v===-1?'单次':(v===0?'-':v+'回合')));

// 精度/暴击率：每点 = 1 个百分点（游戏内口径：命中上限 100、暴击上限 50）。
const pct=v=>(v===undefined||v===null||v==='')?'—':v+'%';
function dmgText(w){ return w.external?w.external:(w.damage!=null?String(w.damage):'—'); }
const CAT_ORDER=['攻击','反击','行动','耐久','治疗'];
function skillDist(u){
  const cnt={};
  u.skills.forEach(s=>{const c=AB[s]?AB[s].cat:'攻击'; cnt[c]=(cnt[c]||0)+1;});
  const parts=CAT_ORDER.filter(c=>cnt[c]).map(c=>{
    const n=cnt[c];
    return `<span class="tag ${c}" title="${c}${n>1?'×'+n:''}">${n>1?n+c:c}</span>`;
  });
  return `<td class="n">${parts.join(' ') || '—'}</td>`;
}
function renderUnits(){
  document.getElementById('th').innerHTML='<tr><th>战团</th><th>兵种</th><th>等级</th><th>名称</th><th>HP(普通)</th><th>精度</th><th>暴击率</th><th>技能分布</th></tr>';
  const k=kw();
  const CHAP_ORDER=['圣血天使','太空野狼','极限战士','黑色圣堂','暗黑天使','帝国之拳','银色颅骨'];
  const CLS_ORDER=['药剂师','突击兵','战术兵','毁灭者'];
  const RANK_ORDER=['T1','T2','T3','T4'];
  const ci=c=>CHAP_ORDER.indexOf(c)<0?99:CHAP_ORDER.indexOf(c);
  const li=c=>CLS_ORDER.indexOf(c)<0?99:CLS_ORDER.indexOf(c);
  const ri=r=>RANK_ORDER.indexOf(r)<0?99:RANK_ORDER.indexOf(r);
  const rows=UN.filter(u=>{
    if(sel['战团']&&sel['战团'].size&&!sel['战团'].has(u.chapter)) return false;
    if(sel['兵种']&&sel['兵种'].size&&!sel['兵种'].has(u.cls)) return false;
    if(sel['等级']&&sel['等级'].size&&!sel['等级'].has(u.rankT)) return false;
    return !k||hayUnit(u).includes(k);
  }).sort((a,b)=> ci(a.chapter)-ci(b.chapter) || li(a.cls)-li(a.cls) || ri(a.rankT)-ri(b.rankT));
  document.getElementById('tb').innerHTML=rows.map(u=>{
    const hp=u.hp||{};
    return `<tr><td class="n">${cap('',u.chapter)}</td><td class="n">${cap('',u.cls)}</td><td>${u.rankT}</td>
      <td><a class="name" data-u="${u.key}"${u.nameAlt?` title="曾用名：${u.nameAlt}"`:''}>${u.name}</a></td>
      <td class="num hp3">${num(hp.normal)}</td><td class="num">${pct(u.accuracy)}</td><td class="num">${pct(u.crit)}</td>${skillDist(u)}</tr>`;
  }).join('');
  document.getElementById('note').textContent='HP(普通) 为普通难度生命值；点击单位查看 普通/困难/极难 三档 HP、精度与暴击率。精度与暴击率按每点 1 个百分点显示（命中上限 100、暴击上限 50）；可在后哨站用经验升级（生命/精度/暴击三选一）。战团：血=圣血天使 狼=太空野狼 极=极限战士 堂=黑色圣堂 暗=暗黑天使 拳=帝国之拳 银=银色颅骨。';
}
function renderWeps(){
  document.getElementById('th').innerHTML='<tr><th>战团</th><th>兵种</th><th>等级</th><th>名称</th><th>类别</th><th>伤害</th><th>特效</th>'+
    ['射程','精度','暴击','暴伤','AP','连射次数'].map(x=>`<th>${x}</th>`).join('')+'</tr>';
  const k=kw();
  const rows=sortWeps(WP.filter(w=>{
    if(sel['兵种']&&sel['兵种'].size&&!sel['兵种'].has(w.slot)) return false;
    if(sel['战团']&&sel['战团'].size&&!sel['战团'].has(w.chapter)) return false;
    if(sel['等级']&&sel['等级'].size&&!sel['等级'].has(w.tier)) return false;
    return !k||hayWep(w).includes(k);
  }));
  document.getElementById('tb').innerHTML=rows.map(w=>{
    const g=w.ref||{};
    const eff=w.effects.map(e=>`<span class="tag ${e.cat||'攻击'}" title="${(e.desc||e.name).replace(/"/g,'&quot;')}">${e.name}</span>`).join(' ');
    return `<tr><td class="n">${w.chapter?cap('',w.chapter):''}</td><td class="n">${cap('',w.slot)}</td><td>${w.tier||'—'}</td>
      <td><a class="name" data-w="${w.key}">${w.display||'制式'}</a></td>
      <td>${w.base||'—'}</td><td class="num">${dmgText(w)}</td><td class="n">${eff}</td>
      <td class="num">${num(g['范围'])}</td><td class="num">${num(g['准成'])}</td><td class="num">${num(g['致命一击'])}</td>
      <td class="num">${num(g['致命伤害'])}</td><td class="num">${num(g['AP消耗'])}</td><td class="num">${num(g['弹发'])}</td></tr>`;
  }).join('');
  document.getElementById('note').textContent='名称优先采用游戏内官方译名（专名武器显示专名，其余为通称/制式）。伤害为武器攻击力（区间为公开攻略整理口径，单值兜底）；射程/精度/暴击/暴伤/AP/连射次数为攻略加成口径。点击武器查看完整数值与特效。';
}
function renderWepsNew(){
  document.getElementById('th').innerHTML='<tr><th>战团</th><th>兵种</th><th>等级</th><th>名称</th><th>类别</th><th>伤害</th><th>特效</th>'+
    ['射程','精度','暴击','暴伤','AP','连射次数'].map(x=>`<th>${x}</th>`).join('')+'</tr>';
  const k=kw();
  const rows=sortWeps(WP.filter(w=>{
    if(sel['兵种']&&sel['兵种'].size&&!sel['兵种'].has(w.slot)) return false;
    if(sel['战团']&&sel['战团'].size&&!sel['战团'].has(w.chapter)) return false;
    if(sel['等级']&&sel['等级'].size&&!sel['等级'].has(w.tier)) return false;
    return !k||hayWep(w).includes(k);
  }));
  document.getElementById('tb').innerHTML=rows.map(w=>{
    const g=w.ref||{};
    const neff=(w._n&&w._n.effects)?w._n.effects:w.effects;
    const eff=neff.map(e=>`<span class="tag ${e.cat||'攻击'}" title="${(e.desc||e.name).replace(/"/g,'&quot;')}">${e.name}</span>`).join(' ');
    const cell=(rk,fld,fmt)=>{const v=nv(w,fld,'new'); return `<td class="num">${v==null?'—':fmt?fmt(v):num(v)}${chgTag(w,fld,'new')}</td>`;};
    return `<tr><td class="n">${w.chapter?cap('',w.chapter):''}</td><td class="n">${cap('',w.slot)}</td><td>${w.tier||'—'}</td>
      <td><a class="name" data-w2="${w.key}">${w.display||'制式'}</a></td>
      <td>${w.base||'—'}</td><td class="num">${num(nv(w,'damage','new'))}${chgTag(w,'damage','new')}</td><td class="n">${eff}</td>
      ${cell('范围','range')}${cell('准成','acc',v=>'+'+v+'%')}${cell('致命一击','crit',v=>'+'+v+'%')}
      ${cell('致命伤害','critdmg',v=>v+'%')}${cell('AP消耗','ap')}${cell('弹发','shots')}</tr>`;
  }).join('');
  document.getElementById('note').textContent='武器(裏)：数值为 PROPOSAL_lessismore_final 提案终值；仅在与原版不同处标注红色 +n / 绿色 -n。共 '+rows.length+' 条。';
}
function renderGear(){
  document.getElementById('th').innerHTML='<tr><th>战团</th><th>类别</th><th>等级</th><th>名称</th><th>冷却</th><th>效果</th></tr>';
  const k=kw();
  const CAT_ORDER2=['手雷','圣物','杂项'];
  const EFF_ORDER2=['攻击','行动','治疗','耐久'];
  const effKey=g=>(g.effects&&g.effects[0])||{};
  const ti=t=>({T1:1,T2:2,T3:3,T4:4})[t]||9;
  const rows=GE.filter(g=>{
    if(sel['战团']&&sel['战团'].size&&!sel['战团'].has(g.chapter)) return false;
    if(sel['等级']&&sel['等级'].size&&!sel['等级'].has(g.tier)) return false;
    return !k||hayGear(g).includes(k);
  }).sort((a,b)=> CAT_ORDER2.indexOf(a.cat)-CAT_ORDER2.indexOf(b.cat)
      || EFF_ORDER2.indexOf(effKey(a).cat)-EFF_ORDER2.indexOf(effKey(b).cat)
      || (effKey(a).desc||'').slice(0,1).localeCompare((effKey(b).desc||'').slice(0,1),'zh')
      || ti(a.tier)-ti(b.tier));
  document.getElementById('tb').innerHTML=rows.map(g=>{
    const eff=(g.effects||[]).map(e=>`<span class="tag ${e.cat||'攻击'}" title="${(e.desc||e.name).replace(/"/g,'&quot;')}">${e.cat||'攻击'}</span>${e.desc||''}`).join(' ');
    const cdg = cdText(g.cd);
    return `<tr><td class="n">${g.chapter?cap('',g.chapter):''}</td><td>${g.cat||'—'}</td><td>${g.tier||'—'}</td>
      <td><a class="name" data-g="${g.key}">${g.name}</a></td>
      <td class="n">${cdg||'—'}</td>
      <td class="txt"><span class="gtxt">${eff||'—'}</span></td></tr>`;
  }).join('');
  document.getElementById('note').textContent='冷却：手雷=4 回合、药剂/圣物/祷文=-1 单次消耗品；未标注冷却的主动技能按默认 3 回合（推断值）、被动技能显示 被动；道具（手雷／圣物／杂项）名称与效果以游戏内中文文本为准，有官方专名的以官方名为准。道具不限兵种，故兵种筛选在本页保留位置但不起作用。';
}
function renderEnemies(){
  document.getElementById('th').innerHTML='<tr><th>名称</th><th>HP(普通)</th><th>HP(困难)</th><th>HP(极难)</th><th>AP</th><th>攻击数</th></tr>';
  const k=kw();
  const rows=EN.filter(e=> !k||hayEnemy(e).includes(k));
  document.getElementById('tb').innerHTML=rows.map(e=>{
    const hp=e.hp||{};
    return `<tr><td><a class="name" data-e="${e.key}">${e.name}</a></td>
      <td class="num hp3">${num(hp.normal)}</td><td class="num hp3">${num(hp.hard)}</td><td class="num hp3">${num(hp.veryhard)}</td>
      <td class="num">${num(e.ap)}</td><td class="num">${e.attacks.length}</td></tr>`;
  }).join('');
  document.getElementById('note').textContent='敌人单位：HP 为普通/困难/极难三档，AP 为每回合行动点。点击敌人查看各攻击剖面的三难度数值。敌方近战攻击精度多为 0（命中由 AI 决定）。';
}
function skTag(v){ return `<span class="tag sk${skAbbr(v)}" title="${v}">${skAbbr(v)}</span>`; }
function renderSkills(){
  document.getElementById('th').innerHTML='<tr><th>载体</th><th>主/被</th><th>技能</th><th>冷却</th><th>购买XP</th><th>效果</th></tr>';
  const k=kw();
  const rows=SK.filter(s=>{
    if(sel['载体']&&sel['载体'].size&&!s.carrier.some(c=>sel['载体'].has(c))) return false;
    if(sel['主被']&&sel['主被'].size&&!sel['主被'].has(s.kind)) return false;
    return !k||haySkill(s).includes(k);
  });
  document.getElementById('tb').innerHTML=rows.map(s=>{
    const car=(s.carrier||[]).map(skTag).join(' ')||'—';
    const desc=s.desc?`<span class="gtxt">${s.desc}</span>`:'<span class="muted">（无文本描述）</span>';
    const cds = cdText(s.cd);
    return `<tr><td class="n">${car}</td><td class="n">${skTag(s.kind)}</td>
      <td><a class="name" data-s="${s.id}">${s.name}</a></td>
      <td class="n">${cds||'—'}</td>
      <td class="n">${s.xp!=null?s.xp:'—'}</td>
      <td class="txt">${s.cat?`<span class="tag ${s.cat}" title="${s.cat}">${s.cat}</span>`:''}${desc}</td></tr>`;
  }).join('');
  document.getElementById('note').textContent=`技能表（当前筛选 ${rows.length}/${SK.length} 条）。冷却：正数为等待回合数、-1=单次消耗品；未标注冷却的主动技能按默认 3 回合（推断）、被动技能显示 被动；手雷=4 回合。载体：人=星际战士，道=装备道具。主/被：主动=可主动施放，被动=常驻生效。点击技能查看分类与效果说明。购买XP 为技能解锁所需经验（付费技能约 3000–20000）；显示 — 者为随装备／手雷／技能书获得、非购买制。`;
}
function render(){ tab===1?renderUnits():(tab===2?renderWeps():(tab===6?renderWepsNew():(tab===3?renderGear():(tab===5?renderSkills():renderEnemies()))));
  document.getElementById('tb').querySelectorAll('.name').forEach(a=>a.onclick=()=>openModal(a));
  if(window.__syncCoinGate) window.__syncCoinGate(tab); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); document.getElementById('mask').classList.remove('on'); }
function openModal(a){
  const m=document.getElementById('modal');
  const X='<span class="x" title="关闭">×</span>';
  if(a.dataset.u){
    const u=UN.find(x=>x.key===a.dataset.u);
    const hp=u.hp||{};
    m.innerHTML=X+`<h3>${u.name}</h3>
      <h4>编制</h4>
      <div class="row"><span>战团</span><span>${cap('',u.chapter)} ${u.chapter}</span></div>
      <div class="row"><span>兵种</span><span>${cap('',u.cls)} ${u.cls}</span></div>
      <div class="row"><span>等级</span><span>${u.rankT}（${u.rank}）</span></div>
      ${u.nameAlt?`<div class="row"><span>曾用名</span><span>${u.nameAlt}</span></div>`:''}
      <div class="row"><span>技能数</span><span>${u.skills.length}</span></div>
      <h4>生命 / 战斗属性</h4>
      <div class="row"><span>HP 普通</span><span>${num(hp.normal)}</span></div>
      ${hp.hard!=null?`<div class="row"><span>HP 困难</span><span>${num(hp.hard)}</span></div>`:`<div class="row"><span>HP 困难</span><span class="muted">—（不随难度变化）</span></div>`}
      ${hp.veryhard!=null?`<div class="row"><span>HP 极难</span><span>${num(hp.veryhard)}</span></div>`:`<div class="row"><span>HP 极难</span><span class="muted">—（不随难度变化）</span></div>`}
      <div class="row"><span>精度</span><span>${pct(u.accuracy)}</span></div>
      <div class="row"><span>暴击率</span><span>${pct(u.crit)}</span></div>
      <h4>技能（${u.skills.length}）</h4>`+
      u.skills.map(s=>AB[s]?`<div class="desc"><b>${AB[s].name}</b> <span class="tag ${AB[s].cat}">${AB[s].cat}</span>
        <span style="color:#9ca3af">${AB[s].kind==='Active'?'主动':'被动'}</span><br>${AB[s].desc||'（无说明）'}</div>`:'').join('')
      +`<button class="close">关闭</button>`;
  }else if(a.dataset.g){
    const g=GE.find(x=>x.key===a.dataset.g);
    m.innerHTML=X+`<h3>${g.name}</h3>
      <h4>属性</h4>
      <div class="row"><span>类别 / 等级</span><span>${g.cat||'—'} / ${g.tier||'—'}</span></div>
      <div class="row"><span>兵种</span><span>全员可用</span></div>
      <div class="row"><span>战团</span><span>${g.chapter?cap('',g.chapter)+' '+g.chapter:'全员可用'}</span></div>
      ${g.cd!=null?`<div class="row"><span>冷却</span><span>${cdText(g.cd)}</span></div>`:''}
      <h4>效果${(g.effects||[]).length?`（${g.effects.length}）`:''}</h4>${(g.effects||[]).length?g.effects.map(e=>`<div class="desc"><b>${e.name}</b> <span class="tag ${e.cat||'攻击'}">${e.cat||'攻击'}</span><br>${e.desc||'—'}</div>`).join(''):'<div class="desc">—</div>'}
      <button class="close">关闭</button>`;
  }else if(a.dataset.e){
    const e=EN.find(x=>x.key===a.dataset.e);
    const hp=e.hp||{};
    const head='<tr><th>形态</th><th>伤害</th><th>精度</th><th>暴击</th><th>暴伤</th><th>AP</th><th>格挡</th><th>反击</th></tr>';
    const atkHtml=e.attacks.map(a2=>{
      const rows=['normal','hard','veryhard'].map(t=>{
        const d=a2.byTier[t];
        const lbl={normal:'普通',hard:'困难',veryhard:'极难'}[t];
        if(!d) return `<tr><td>${lbl}</td><td colspan="7" class="muted">— 无该难度数据 —</td></tr>`;
        return `<tr><td>${lbl}</td><td class="num">${num(d.damage)}</td><td class="num">${num(d.acc)}</td><td class="num">${num(d.crit)}</td><td class="num">${num(d.critdmg)}</td><td class="num">${num(d.ap)}</td><td class="num">${num(d.parry)}</td><td class="num">${num(d.counter)}</td></tr>`;
      }).join('');
      return `<h4>${a2.name}</h4><table class="atktbl"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
    }).join('');
    m.innerHTML=X+`<h3>${e.name}</h3>
      <h4>生命 / 行动点</h4>
      <div class="row"><span>HP 普通 / 困难 / 极难</span><span class="hp3">${num(hp.normal)} / ${num(hp.hard)} / ${num(hp.veryhard)}</span></div>
      <div class="row"><span>AP</span><span>${num(e.ap)}</span></div>
      <h4>攻击剖面（${e.attacks.length}）</h4>${atkHtml||'<div class="desc">—</div>'}
      <button class="close">关闭</button>`;
  }else if(a.dataset.s){
    const s=SK.find(x=>x.id===a.dataset.s);
    const c=AB[s.id]||{};
    m.innerHTML=X+`<h3>${s.name}</h3>
      <div class="row"><span>分类</span><span>${(c.cat||'')?`<span class="tag ${c.cat}">${c.cat}</span>`:'—'}</span></div>
      <div class="row"><span>载体</span><span>${(s.carrier||[]).map(skTag).join(' ')||'—'}</span></div>
      <div class="row"><span>主 / 被</span><span>${skTag(s.kind)} ${s.kind}</span></div>
      ${s.cd!=null?`<div class="row"><span>冷却</span><span>${cdText(s.cd)}</span></div>`:''}
      <h4>效果</h4><div class="desc">${s.desc||'—（无文本描述）'}</div>
      <button class="close">关闭</button>`;
  }else{
    const isNew=!!a.dataset.w2;
    const w=WP.find(x=>x.key===(isNew?a.dataset.w2:a.dataset.w)), g=w.ref||{};
    const EFF=(isNew&&w._n&&w._n.effects)?w._n.effects:w.effects;
    m.innerHTML=X+`<h3>${w.display||'制式'}</h3>
      <h4>属性</h4>
      <div class="row"><span>类别 / 等级</span><span>${w.base||'—'} / ${w.tier||'—'}</span></div>
      <div class="row"><span>兵种</span><span>${cap('',w.slot)} ${w.slot}</span></div>
      <div class="row"><span>战团</span><span>${w.chapter?cap('',w.chapter)+' '+w.chapter:'全员可用'}</span></div>
      <h4>特效</h4>${EFF.length?EFF.map(e=>`<div class="desc"><b>${e.name}</b> <span class="tag ${e.cat||'攻击'}">${e.cat||'攻击'}</span><br>${e.desc||'—'}</div>`).join(''):'<div class="desc">—</div>'}
      <h4>战斗数值</h4>
      ${['damage','range','shots','acc','crit','critdmg','ap','parry','counter'].map(f=>{
        const lab={'damage':'伤害','range':'射程','shots':'连射次数','acc':'精度','crit':'暴击','critdmg':'暴伤','ap':'AP','parry':'格挡','counter':'反击'}[f];
        const val=f==='damage'?(isNew?num(nv(w,'damage','new')):dmgText(w)):num(nv(w,f,isNew?'new':'old'));
        return `<div class="row"><span>${lab}</span><span>${val}${chgTag(w,f,isNew?'new':'old')}</span></div>`;}).join('')}
      ${w.external?`<div class="row"><span>${isNew?'原版伤害区间':'伤害区间'}</span><span>${w.external}</span></div>`:''}
      <h4>数值（攻略加成）</h4>
      ${[['范围','射程','range'],['准成','精度','acc'],['致命一击','暴击','crit'],['致命伤害','暴伤','critdmg'],['AP消耗','AP','ap'],['弹发','连射次数','shots']].map(p=>`<div class="row"><span>${p[1]}</span><span>${num(nv(w,p[2],isNew?'new':'old'))}${chgTag(w,p[2],isNew?'new':'old')}</span></div>`).join('')}
      ${g['效果']?`<h4>效果说明</h4><div class="desc">${g['效果']}</div>`:''}
      <button class="close">关闭</button>`;
  }
  m.classList.add('on'); document.getElementById('mask').classList.add('on');
}
document.getElementById('mask').onclick=closeModal;
document.getElementById('modal').onclick=closeModal;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  tab=+t.dataset.t; sel={}; buildBar(); render();
});

/* ==================== 武器(裏) 页：投币提示卡 ====================
   纯「软提示」，不做任何校验：
   - 不读投币状态、不判环境、不依赖 SDK 返回值；
   - 默认隐藏表格，显示提示卡；
   - 「前往投币」打开对应视频（Toy 内优先 toy.navigate，失败回退新标签页）；
   - 「让我康康」直接把表格放出来（纯前端切换）。

   背景：此前用 toy.getVideoUserActions 做投币校验，实测 PC 与手机端都拿不到可信的
   投币状态（拿不到 Toy 上下文 / 环境判定不成立），会被误判成「本地预览」。
   既然拦不住也不该误伤，就改为不拦截，只保留提示与跳转。
*/
(function(){
  var BVID='BV1HEyazxEXa';                 // 「前往投币」指向的视频
  var TAB_T=6;                             // 武器(裏) 对应的 data-t
  var TITLE='「武器(裏)」来自「26年新汉化补丁」';

  var stage=document.getElementById('coinStage');
  var gate=document.getElementById('coinGate');
  var revealed=false;                      // 本次会话内点过「让我康康」

  function draw(){
    if(!stage || !gate) return;

    // 只在武器(裏)页展示提示卡，其余页彻底复原
    if(tab!==TAB_T){
      stage.classList.remove('locked');
      gate.className='coin-gate';
      gate.innerHTML='';
      return;
    }

    stage.classList.toggle('locked', !revealed);
    if(revealed){
      gate.className='coin-gate';
      gate.innerHTML='';
      return;
    }

    gate.className='coin-gate on';
    gate.innerHTML='<div class="coin-card">'+
        '<h3>'+TITLE+'</h3>'+
        '<p>请了解一下 <a href="https://www.bilibili.com/video/BV1HEyazxEXa/" target="_blank" rel="noopener noreferrer" style="color:#2563eb">BV1HEyazxEXa</a> 、投币后再来看吧~</p>'+
        '<div class="coin-btns">'+
          '<button class="coin-btn" id="coinGo" type="button">前往投币</button>'+
          '<button class="coin-btn ghost" id="coinReveal" type="button">让我康康</button>'+
        '</div>'+
      '</div>';

    var go=document.getElementById('coinGo');
    if(go) go.onclick=openVideo;

    var reveal=document.getElementById('coinReveal');
    if(reveal) reveal.onclick=function(){ revealed=true; draw(); };
  }

  // 打开视频：Toy 内优先走 toy.navigate（官方要求在用户手势中同步调用），失败回退新标签
  function openVideo(){
    var url='https://www.bilibili.com/video/'+encodeURIComponent(BVID)+'/';
    try{
      if(window.toy && typeof window.toy.navigate==='function'){
        window.toy.navigate({type:'video', id:BVID}).catch(function(){
          window.open(url,'_blank','noopener,noreferrer');
        });
        return;
      }
    }catch(e){ /* 落到下面的兜底 */ }
    window.open(url,'_blank','noopener,noreferrer');
  }

  // 供全局 render() 调用：切到武器(裏)页时同步提示卡状态
  window.__syncCoinGate=function(){ draw(); };

  draw(); // 初始化
})();

</script>
